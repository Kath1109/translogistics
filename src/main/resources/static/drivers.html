<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conductores</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <h1>Lista de Conductores</h1>
      <nav>
        <a href="/">Volver al inicio</a>
      </nav>
    </header>

    <section>
      <h2>Agregar Nuevo Conductor</h2>
      <form action="/api/drivers" method="POST" id="addDriverForm">
        <label for="driverName">Nombre:</label>
        <input type="text" id="driverName" name="driverName" required />

        <label for="driverIdNumber">Número de Identificación:</label>
        <input type="text" id="driverIdNumber" name="driverIdNumber" required />

        <label for="driverLicense">Número de Licencia:</label>
        <input type="text" id="driverLicense" name="driverLicense" required />

        <button type="submit">Agregar Conductor</button>
      </form>
    </section>

    <section>
      <h2>Conductores Registrados</h2>
      <ul id="driverList">
        <!-- Aquí se cargará la lista de conductores desde la API -->
      </ul>
    </section>

    <footer>
      <p>© 2025 Translogistics</p>
    </footer>

    <script>
      // Cargar la lista de conductores desde la API
      fetch("/api/drivers")
        .then((response) => response.json())
        .then((data) => {
          const driverList = document.getElementById("driverList");
          data.forEach((driver) => {
            const li = document.createElement("li");
            li.textContent = `ID: ${driver.id}, Nombre: ${driver.name}, Licencia: ${driver.licenseNumber}`;
            driverList.appendChild(li);
          });
        });
    </script>
  </body>
</html>
