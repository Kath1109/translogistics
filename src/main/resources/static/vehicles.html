<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>Lista de Vehículos</h1>
        <nav>
            <a href="/">Volver al inicio</a>
        </nav>
    </header>

    <section>
        <h2>Agregar Nuevo Vehículo</h2>
        <form action="/api/vehicles" method="POST" id="addVehicleForm">
            <label for="vehiclePlate">Placa:</label>
            <input type="text" id="vehiclePlate" name="vehiclePlate" required>

            <label for="vehicleModel">Modelo:</label>
            <input type="text" id="vehicleModel" name="vehicleModel" required>

            <label for="vehicleYear">Año:</label>
            <input type="number" id="vehicleYear" name="vehicleYear" required>

            <button type="submit">Agregar Vehículo</button>
        </form>
    </section>

    <section>
        <h2>Vehículos Registrados</h2>
        <ul id="vehicleList">
            <!-- Aquí se cargará la lista de vehículos desde la API -->
        </ul>
    </section>

    <footer>
        <p>© 2025 Translogistics</p>
    </footer>

    <script>
        // Cargar la lista de vehículos desde la API
        fetch('/api/vehicles')
            .then(response => response.json())
            .then(data => {
                const vehicleList = document.getElementById('vehicleList');
                data.forEach(vehicle => {
                    const li = document.createElement('li');
                    li.textContent = `Placa: ${vehicle.plate}, Modelo: ${vehicle.model}, Año: ${vehicle.year}`;
                    vehicleList.appendChild(li);
                });
            });
    </script>
</body>
</html>
